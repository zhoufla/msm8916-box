name: build-release

# 打 tag 触发：git tag v1.3.1 && git push origin v1.3.1
# 两个机型一起出包：sp970（无后缀）+ jz02（-jz02 后缀，内嵌 jz02 默认配置）
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.3.1），仅手动触发时用'
        required: true
        default: '1.3.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        model: [sp970, jz02]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android@v3：它被强制运行在 Node 24 上会直接失败
      # （v1.3.0、v1.3.1 两次云编译都挂在 setup-android 这一步），改为手工装 sdkmanager。
      - name: 安装 Android SDK（android-19 + build-tools 34）
        run: |
          set -eux
          SDK="$HOME/android-sdk"
          URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          mkdir -p "$SDK/cmdline-tools"
          curl -fL --retry 3 --retry-delay 3 -o /tmp/cmdtools.zip "$URL"
          unzip -q -o /tmp/cmdtools.zip -d /tmp/cmdtools
          rm -rf "$SDK/cmdline-tools/latest"
          mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes 2>/dev/null | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-19" "build-tools;34.0.0"
          ls -l "$SDK/platforms/android-19/android.jar" "$SDK/build-tools/34.0.0/aapt" \
                "$SDK/build-tools/34.0.0/d8" "$SDK/build-tools/34.0.0/apksigner"

      - name: 计算版本号
        id: v
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            RAW="${GITHUB_REF_NAME#v}"
          else
            RAW="${{ inputs.version }}"
          fi
          IFS=. read -r MA MI PA <<< "$RAW"
          PA=${PA:-0}
          CODE=$((MA * 10000 + MI * 100 + PA))
          echo "ver=$RAW" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "版本 $RAW (versionCode $CODE)"

      - name: 离线测试
        run: |
          chmod +x build.sh tools/run-tests.sh
          ./tools/run-tests.sh

      - name: 构建 APK（${{ matrix.model }}）
        run: |
          ANDROID_SDK="$ANDROID_SDK_ROOT" \
          VER="${{ steps.v.outputs.ver }}" \
          VC="${{ steps.v.outputs.code }}" \
          MODEL="${{ matrix.model }}" \
          ./build.sh

      - name: 校验签名
        run: |
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --print-certs dist/*.apk | head -4
          cat dist/latest*.json

      # 两个机型各自上传 dist 产物，release job 汇总成一个 Release
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.model }}
          path: |
            dist/*.apk
            dist/latest*.json

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-all

      - name: 汇总产物 + 生成兼容老版本的 latest.json
        run: |
          mkdir dist
          # 两个机型的 APK 文件名不同，可以直接并到 dist/
          cp dist-all/dist-sp970/*.apk dist-all/dist-jz02/*.apk dist/
          # build.sh 里 sp970 产出 latest.json、jz02 产出 latest-jz02.json；直接 glob 拷贝
          # 会让 jz02 清单覆盖 sp970，dist 里也没有 latest-sp970.json，设备按机型取
          # sha256 时只能拿到 jz02 的，装机校验必挂（v1.8.15 实测）。这里按机型改名。
          cp dist-all/dist-sp970/latest.json dist/latest-sp970.json
          cp dist-all/dist-jz02/latest-jz02.json dist/latest-jz02.json
          python3 - <<'EOF'
          import json, glob
          latest = None
          models = {}
          for f in sorted(glob.glob('dist/latest-*.json')):
              d = json.load(open(f))
              models[d['model']] = d
              if d['model'] == 'sp970':
                  latest = dict(d)          # 老版本设备只认 latest.json 的平铺字段
          latest = latest or dict(models[list(models)[0]])
          latest['models'] = models
          json.dump(latest, open('dist/latest.json', 'w'), indent=2)
          print(json.dumps(latest, indent=2))
          EOF

      - name: 计算版本号
        id: v
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            RAW="${GITHUB_REF_NAME#v}"
          else
            RAW="${{ inputs.version }}"
          fi
          echo "ver=$RAW" >> "$GITHUB_OUTPUT"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.ver }}
          name: v${{ steps.v.outputs.ver }}
          generate_release_notes: true
          body: |
            由 GitHub Actions 构建（JDK 17 + build-tools 34 + android-19），两个机型同时出包：

            - `com.sp970.smsrelay-<版本>.apk` — SP970-B
            - `com.sp970.smsrelay-<版本>-jz02.apk` — JZ02 / UFI 棒子（内嵌 jz02 默认配置）
            - `latest.json` 含各机型清单；设备端「检查更新」自动匹配本机型资产。

            设备端在面板「升级」页点「检查更新」即可，或等自动检查（默认 24 小时）。
            安装包 SHA-256 见 `latest*.json`；签名与既有安装一致，`install -r` 不会丢数据。
          files: |
            dist/*.apk
            dist/latest*.json
