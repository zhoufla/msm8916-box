name: build-release

# 打 tag 触发：git tag v1.3.1 && git push origin v1.3.1
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.3.1），仅手动触发时用'
        required: true
        default: '1.3.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android@v3：它被强制运行在 Node 24 上会直接失败
      # （v1.3.0、v1.3.1 两次云编译都挂在 setup-android 这一步），改为手工装 sdkmanager。
      - name: 安装 Android SDK（android-19 + build-tools 34）
        run: |
          set -eux
          SDK="$HOME/android-sdk"
          URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          mkdir -p "$SDK/cmdline-tools"
          curl -fL --retry 3 --retry-delay 3 -o /tmp/cmdtools.zip "$URL"
          unzip -q -o /tmp/cmdtools.zip -d /tmp/cmdtools
          rm -rf "$SDK/cmdline-tools/latest"
          mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes 2>/dev/null | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-19" "build-tools;34.0.0"
          ls -l "$SDK/platforms/android-19/android.jar" "$SDK/build-tools/34.0.0/aapt" \
                "$SDK/build-tools/34.0.0/d8" "$SDK/build-tools/34.0.0/apksigner"

      - name: 计算版本号
        id: v
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            RAW="${GITHUB_REF_NAME#v}"
          else
            RAW="${{ inputs.version }}"
          fi
          IFS=. read -r MA MI PA <<< "$RAW"
          PA=${PA:-0}
          CODE=$((MA * 10000 + MI * 100 + PA))
          echo "ver=$RAW" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "版本 $RAW (versionCode $CODE)"

      - name: 离线测试
        run: |
          chmod +x build.sh tools/run-tests.sh
          ./tools/run-tests.sh

      - name: 构建 APK
        run: |
          ANDROID_SDK="$ANDROID_SDK_ROOT" \
          VER="${{ steps.v.outputs.ver }}" \
          VC="${{ steps.v.outputs.code }}" \
          ./build.sh

      - name: 校验签名
        run: |
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --print-certs dist/*.apk | head -4
          cat dist/latest.json

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.ver }}
          name: v${{ steps.v.outputs.ver }}
          generate_release_notes: true
          body: |
            由 GitHub Actions 构建（JDK 17 + build-tools 34 + android-19）。

            设备端在面板「升级」页点「检查更新」即可，或等自动检查（默认 24 小时）。
            安装包 SHA-256 见 `latest.json`；签名与既有安装一致，`install -r` 不会丢数据。
          files: |
            dist/com.sp970.smsrelay-${{ steps.v.outputs.ver }}.apk
            dist/latest.json
